    # path: "./outputs/gemma_2_9B/gemma_9B_Corrected_Dataset/final_experiment_llm_results.csv"
  - model: "llama-3_8B"
    path: "./outputs/llama3_8b/Llama31_8B_Corrected_Dataset/final_experiment_llm_results.csv"

analysis:
  merge_key: "base_experiment_ID"
  cluster_col: "detail"
  judgment_model_col: "judgment_model"
  forward_selection_col: "forward_selected_option"
  option_1_rating_col: "llm_rating_forward_answer_potential_statement1"
  option_2_rating_col: "llm_rating_forward_answer_potential_statement2"
  selected_rating_col: "selected_likelihood_rating"
  selected_rating_source_col: "selected_likelihood_rating_source"
  predictor_cols:
    - "selected_likelihood_rating"
  categorical_predictor_cols:
    - "selected_likelihood_rating"
  include_model_interactions: true
  marginal_rating_values:
    - 1
    - 2
    - 3
    - 4
    - 5
  lpm_outcomes:
    - "is_fully_consistent"
  logit_outcomes:
    - "is_fully_consistent"
  linear_outcomes:
    - "total_consistency_score"
  samples:
    - name: "full_range"
      min_selected_rating: null
    - name: "at_least_plausible"
      min_selected_rating: 3

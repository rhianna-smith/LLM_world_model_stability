paths:
  ratings_path: "./dataset pipeline/Corrected_Dataset_llm_ratings_final.csv"
  analysis_output_dir: "./outputs/pooled_judgment_analysis_llama_original_and_rerun"

judgment_results:
  # - model: "gpt-4.1"
    # path: "./outputs/gpt4_1_rerun_and_original/final_experiment_llm_results.csv"
  # - model: "gpt-5.4-mini"
    # path: "./outputs/gpt5_4mini_rerun_and_original/final_experiment_llm_results.csv"
  # - model: "gpt-5.5"
